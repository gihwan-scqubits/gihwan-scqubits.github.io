<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 720 200"
     width="100%"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="heroFigTitle"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">

  <title id="heroFigTitle">Circuit QED schematic</title>

  <style>
    .acc1   { stroke: var(--fig-acc1, #0b6e99); }
    .acc1-f { fill:   var(--fig-acc1, #0b6e99); }
    .acc2   { stroke: var(--fig-acc2, #d9480f); }
    .acc2-f { fill:   var(--fig-acc2, #d9480f); }
    .thin   { stroke-width: 1; }
    .dash   { stroke-width: 1; stroke-dasharray: 2 3; }
    text    { stroke: none; fill: currentColor; }
    .sans   { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; }
    .tiny   { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-size: 9px; }
    .panel  { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 700; }
    .math   { font-family: 'Latin Modern Math', 'STIX Two Math', 'Times New Roman', serif; font-style: italic; font-size: 13px; }
  </style>

  <!-- ground: common ground plane rail for the qubit section -->
  <g id="ground">
    <path d="M32,150 H300" />
    <path d="M145,150 V157" class="thin" />
    <path d="M135,157 H155 M139,161 H151 M142,165 H148" class="thin" />
  </g>

  <!-- qubit1: shunt capacitor in parallel with a two-junction SQUID loop, flux biased -->
  <g id="qubit1">
    <path d="M48,62 H100" />
    <path d="M48,62 V78 M32,78 H64 M32,86 H64 M48,86 V150" />
    <path d="M100,62 V80 M86,80 H114 M86,80 V122 M114,80 V122 M86,122 H114 M100,122 V150" />
    <path d="M81,96 L91,106 M91,96 L81,106" class="thin" />
    <path d="M109,96 L119,106 M119,96 L109,106" class="thin" />
    <path d="M154,101 H128" class="acc2" />
    <path d="M135,96 L128,101 L135,106" class="acc2" />
  </g>

  <!-- coupler: grounded tunable coupler element, capacitively linked to both qubits -->
  <g id="coupler">
    <path d="M100,62 H132 M138,62 H158 M214,62 H228 M234,62 H300" />
    <path d="M132,54 V70 M138,54 V70" class="thin" />
    <path d="M228,54 V70 M234,54 V70" class="thin" />
    <rect x="158" y="46" width="56" height="32" rx="3" class="acc2" />
    <path d="M186,78 V150" class="acc2" />
    <path d="M181,107 L191,117 M191,107 L181,117" class="acc2 thin" />
  </g>

  <!-- qubit2: shunt capacitor with a single Josephson junction, emitter into the waveguide -->
  <g id="qubit2">
    <path d="M258,62 V78 M242,78 H274 M242,86 H274 M258,86 V150" />
    <path d="M300,62 V150" />
    <path d="M295,96 L305,106 M305,96 L295,106" class="thin" />
    <path d="M300,62 H410" />
  </g>

  <!-- readout: capacitively coupled quarter-wave meander shorted to ground -->
  <g id="readout">
    <path d="M338,62 V76" />
    <path d="M324,76 H352 M324,82 H352" class="thin" />
    <path d="M338,82 V96 H360 V104 H318 V112 H360 V120 H318 V128 H360 V136 H338 V148" />
    <path d="M328,148 H348 M332,152 H344 M335,156 H341" class="thin" />
    <path d="M384,54 V70 M390,54 V70" class="thin" />
  </g>

  <!-- waveguide: coplanar line carrying a train of entangled photon wave packets -->
  <g id="waveguide">
    <path d="M410,62 V120 H424" />
    <path d="M424,120 H700" class="acc1" />
    <path d="M424,106 H700 M424,134 H700" class="thin" />
    <path d="M454,98 C466,98 470,64 480,64 C490,64 494,98 506,98" class="acc1 acc1-f" fill-opacity="0.15" />
    <path d="M514,98 C526,98 530,64 540,64 C550,64 554,98 566,98" class="acc1 acc1-f" fill-opacity="0.15" />
    <path d="M574,98 C586,98 590,64 600,64 C610,64 614,98 626,98" class="acc1 acc1-f" fill-opacity="0.15" />
    <path d="M634,98 C646,98 650,64 660,64 C670,64 674,98 686,98" class="acc1 acc1-f" fill-opacity="0.15" />
    <path d="M480,48 V60 M540,48 V60 M600,48 V60 M660,48 V60" class="dash" />
    <path d="M484,43 H536 M544,43 H596 M604,43 H656" class="thin" />
    <circle cx="480" cy="43" r="4.5" class="acc1" />
    <circle cx="540" cy="43" r="4.5" class="acc1" />
    <circle cx="600" cy="43" r="4.5" class="acc1" />
    <circle cx="660" cy="43" r="4.5" class="acc1" />
    <path d="M560,156 H660" />
    <path d="M653,151 L660,156 L653,161" />
  </g>

  <!-- labels: panel letter and component annotations -->
  <g id="labels">
    <text class="panel" x="20" y="32">a</text>
    <text class="sans" x="74" y="42" text-anchor="middle">Q1</text>
    <text class="tiny" x="186" y="66" text-anchor="middle">coupler</text>
    <text class="sans" x="279" y="42" text-anchor="middle">Q2</text>
    <text class="math" x="372" y="120">&#969;<tspan font-size="9" dy="3">r</tspan></text>
    <text class="math" x="142" y="93" text-anchor="middle">&#934;</text>
    <text class="sans" x="424" y="160">waveguide</text>
  </g>

</svg>
